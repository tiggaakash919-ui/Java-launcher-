name: Build Minecraft Launcher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cubiq-Launcher
        uses: actions/checkout@v4
        with:
          repository: VivxKumar07/Cubiq-Launcher
          path: cubiq

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Build APK
        working-directory: cubiq
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cubiq-minecraft-debug
          path: cubiq/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
